name: Healthcare Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Check Python Syntax in Notebooks
        run: |
          python -m py_compile notebooks/*.py
          echo "All Python ETL scripts compiled successfully!"

      - name: Lint Codebase
        run: |
          # Stop build if there are Python syntax errors or undefined names
          # Includes Databricks environment built-ins (spark, display, dbutils)
          flake8 notebooks/ --count --select=E9,F63,F7,F82 --builtins=spark,display,dbutils --show-source --statistics
